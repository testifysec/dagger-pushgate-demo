# Arm B: Dagger on the runner. Same checks as a laptop `dagger check`, on a
# fresh engine with a cold cache every run.
name: B dagger check
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  DAGGER_VERSION: 1.0.0-beta.19
  DO_NOT_TRACK: "1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
      - run: dagger check --progress report
